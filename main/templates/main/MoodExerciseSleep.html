<!DOCTYPE html>
<!-- Mood Exercise Sleep -->
<html>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
<body>

<canvas id="myChart" style="width:100%;max-width:800px"></canvas>

<script>

var ctx = document.getElementById('myChart').getContext('2d');
var data1 = [5, 3, 2, 3, 4, 3, 2]; //mood
var data2 = [3, 2, 2, 1, 3, 1, 2]; //sleep
var data3 = [3, 3, 3, 2, 1, 2, 3]; //exercise

var lineOptions = {
    legend: {display: true},
	title: {
      display: true,
      text: "April 3-9 Stats"
    },
    scales: {
      yAxes: [{
	  ticks: {min: 0, max:5}
	  }]
    }
  };

var myChart = new Chart(ctx, {
    type: 'line',
    data: {
        labels: ['3', '4', '5', '6', '7', '8', '9'],
        datasets: [{
            label: 'Mood',
			fill: false,
            data: data1,
            borderColor: 'rgba(255, 0, 0, 1)',
            borderWidth: 3
        }, {
            label: 'Sleep',
			fill: false,
            data: data2,
            borderColor: 'rgba(0, 255, 0, 1)',
            borderWidth: 3
        }, {
            label: 'Exercise',
			fill: false,
            data: data3,
            borderColor: 'rgba(0, 0, 255, 1)',
            borderWidth: 3
        }]
    },
    options: lineOptions
});

</script>

</body>
</html>
