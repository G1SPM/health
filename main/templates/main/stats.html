<html>
<head
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Custom CSS -->
    {% load static %}
    <link type="text/css" rel="stylesheet" href="{% static 'css/stats.css' %}">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.9.4/Chart.js"></script>
    <title>Stats</title>
</head>

<body>
    <h1> Analytics   </h1>
    <br>
    <div id="carouselExampleInterval" class="carousel slide" data-ride="carousel">
        <div class="carousel-inner">

            <div class="carousel-item c-item" data-interval="3000">
                <canvas id="myChart5" style="width:100%;max-width:800px"></canvas>

                <script>
                    var ctx = document.getElementById('myChart5').getContext('2d');
                    var data1 = {{mood_values|safe}};
                    var data2 = [5, 5, 5, 5, 5, 5, 5];

                    var lineOptions = {
                        responsive: true,
                        legend: {display: true},
                        title: {
                        display: true,
                        },
                        scales: {
                        yAxes: [{
                        ticks: {min: 0, max:5}
                        }]
                        }
                    };

                    var myChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: {{labels|safe}},
                            datasets: [{
                                label: 'Tracked Mood',
                                type: 'bar',
                                fill: false,
                                data: data1,
                                borderColor: 'rgba(255, 0, 0, 1)',
                                borderWidth: 3
                            }, {
                                label: 'Goal Mood',
                                type: 'line',
                                fill: false,
                                data: data2,
                                borderColor: 'rgba(0, 255, 0, 1)',
                                borderWidth: 3
                            }]
                        },
                        options: lineOptions
                    });

                </script>
            </div>

            <div class="carousel-item c-item" data-interval="3000">
                <canvas id="myChart6" style="width:100%;max-width:800px"></canvas>

                <script>
                    var xValues2 = ["Mood","Relax Time","Screen Time"];
                    var yValues2 = [4.1,2.6,1.6];

                    var barColors2 = ["#b112e5","#00aba9","#1e8213"];

                    new Chart("myChart6", {
                    type: "doughnut",
                    data: {
                        labels: xValues2,
                        datasets: [{
                        backgroundColor: barColors2,
                        data: yValues2
                        }]
                    },
                    options: {
                    legend: {display: true},
                        title: {
                        display: true,
                        text: "Average Stats for Mood"
                        }
                    }
                    });
                </script>
            </div>

            <div class="carousel-item active c-item" data-interval="3000">
                <canvas id="myChart" style="width:100%;max-width:800px"></canvas>
                <script>
                var ctx = document.getElementById('myChart').getContext('2d');
                var data1 = {{ mood_values|safe }};
                var data2 = {{ sleep_values|safe }};
                var data3 = {{ exercise_values|safe }};
                var labels = {{ labels|safe }};
            
                var lineOptions = {
                    legend: { display: true },
                    title: {
                    display: true,
                    },
                    scales: {
                    yAxes: [{ ticks: { min: 0, max: 5 } }]
                    }
                };
            
                var myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                    labels: labels,
                    datasets: [{
                        label: 'Mood',
                        fill: false,
                        data: data1,
                        borderColor: 'rgba(255, 0, 0, 1)',
                        borderWidth: 3
                    }, {
                        label: 'Sleep',
                        fill: false,
                        data: data2,
                        borderColor: 'rgba(0, 255, 0, 1)',
                        borderWidth: 3
                    }, {
                        label: 'Exercise',
                        fill: false,
                        data: data3,
                        borderColor: 'rgba(255, 0, 255, 1)',
                        borderWidth: 3
                    }]
                    },
                    options: lineOptions
                });
                </script>
            </div>
          
            <div class="carousel-item c-item" data-interval="3000">
                <canvas id="myChart2" style="width:100%;max-width:800px"></canvas>

                <script>
                
                var ctx = document.getElementById('myChart2').getContext('2d');
                var data1 = {{mood_values|safe}};
                var data2 = {{steps_values|safe}};
                var data3 = {{water_values|safe}};
                var labels = {{labels|safe}}
                
                var lineOptions = {
                    legend: {display: true},
                    title: {
                    display: true,
                    },
                    scales: {
                    yAxes: [{
                    ticks: {min: 0, max:5}
                    }]
                    }
                };
                
                var myChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Mood',
                            fill: false,
                            data: data1,
                            borderColor: 'rgba(255, 0, 0, 1)',
                            borderWidth: 3
                        }, {
                            label: 'Steps',
                            fill: false,
                            data: data2,
                            borderColor: 'rgba(0, 255, 0, 1)',
                            borderWidth: 3
                        }, {
                            label: 'Water',
                            fill: false,
                            data: data3,
                            borderColor: 'rgba(0, 0, 255, 1)',
                            borderWidth: 3
                        }]
                    },
                    options: lineOptions
                });
                
                </script>
            </div>
          
            <div class="carousel-item c-item" data-interval="3000">
                <canvas id="myChart3" style="width:100%;max-width:800px"></canvas>
                <script>
                
                    var ctx = document.getElementById('myChart3').getContext('2d');
                    var data1 = {{screen_values|safe}};
                    var data2 = [3,3,3,3,3,3,3,3,3];
                    
                    var lineOptions = {
                        responsive: true,
                        legend: {display: true},
                        title: {
                        display: true,
                        },
                        scales: {
                        yAxes: [{
                        ticks: {min: 0, max:3}
                        }]
                        }
                    };
                
                    var myChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Tracked Screen Time',
                                type: 'line',
                                fill: false,
                                data: data1,
                                borderColor: 'rgba(255, 0, 0, 1)',
                                borderWidth: 3
                            }, {
                                label: 'Goal Screen Time',
                                type: 'scatter',
                                fill: false,
                                data: data2,
                                borderColor: 'rgba(0, 255, 0, 1)',
                                borderWidth: 3
                            }]
                        },
                        options: lineOptions
                    });
                
                </script>
            </div>

            <div class="carousel-item c-item" data-interval="3000">
                <canvas id="myChart4" style="width:100%;max-width:800px"></canvas>
                    <script>
                        var ctx = document.getElementById('myChart4').getContext('2d');
                        var data1 = {{exercise_values|safe}};
                        var data2 = [2,2,2,2,2,2,2,2,2];

                        var lineOptions = {
                            responsive: true,
                            legend: {display: true},
                            title: {
                            display: true,
                            },
                            scales: {
                            yAxes: [{
                            ticks: {min: 0, max:3}
                            }]
                            }
                        };

                        var myChart = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: {{labels|safe}},
                                datasets: [{
                                    label: 'Tracked Exercise',
                                    fill: false,
                                    data: data1,
                                    borderColor: 'rgba(255, 0, 0, 1)',
                                    borderWidth: 3
                                }, {
                                    label: 'Goal Exercise',
                                    fill: false,
                                    data: data2,
                                    borderColor: 'rgba(0, 255, 0, 1)',
                                    borderWidth: 3
                                }]
                            },
                            options: lineOptions
                        });

                    </script>
            </div>

        <a class="carousel-control-prev" href="#carouselExampleInterval" role="button" data-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#carouselExampleInterval" role="button" data-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="sr-only">Next</span>
        </a>
      </div>
      <br>
      <a type="button" class="btn btn-primary" href="{% url 'home' %}">Return Home</a>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@2.9.3/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.min.js"></script>
  </body>
</html>
